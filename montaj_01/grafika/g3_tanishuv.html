<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  #bot { left: 200px; top: 560px; width: 680px; height: 748px; transform-origin: 50% 95%; }
  #name { top: 250px; font-size: 150px; }
  #role { top: 430px; background: #F6B52F; color: #041512; font-family: "General Sans SemiBold"; }
  .ray { position: absolute; left: 540px; top: 900px; width: 8px; height: 900px; margin-left: -4px; transform-origin: 50% 0;
         background: linear-gradient(rgba(246,181,47,.35), rgba(246,181,47,0)); }
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div id="rays"></div>
<div class="h1" id="name">PANEL<span class="sun">BEK</span></div>
<div class="pill" id="role">Premium Solar muhandisi</div>
<div class="bot" id="bot"></div>
<script src="../../mashq/node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../mashq/scenes/common.js"></script>
<script src="../../mashq/scenes/panelbek.js"></script>
<script src="lib.js"></script>
<script>
  const R = document.getElementById('rays');
  for (let k = 0; k < 14; k++) R.insertAdjacentHTML('beforeend', `<div class="ray" style="transform:rotate(${k * 360 / 14}deg)"></div>`);
  const B = document.getElementById('bot'); makeBot(B, ['salom', 'kozqisish']);
  const tl = gsap.timeline({ paused: true });
  tl.fromTo('#rays', { rotation: 0, opacity: 0 }, { rotation: 40, opacity: 1, duration: 4.2, ease: 'none', transformOrigin: '540px 900px' }, 0)
    .fromTo(B, { y: 1300, scaleY: 1 }, { y: 0, duration: 0.42, ease: 'power3.out' }, 0)
    .to(B, { scaleY: 0.9, scaleX: 1.06, duration: 0.08, ease: 'power1.out' }, 0.42)
    .to(B, { scaleY: 1, scaleX: 1, duration: 0.35, ease: 'elastic.out(1.2,0.4)' }, 0.5)
    .to(B, { rotation: 3, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 6 }, 0.9)
    .fromTo('#name', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2.2)' }, 0.78)
    .fromTo('#role', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power3.out' }, 1.55);
  face(tl, B, 'kozqisish', 2.8); face(tl, B, 'salom', 3.15);
  tl.set({}, {}, 4.2);
  window.tl = tl;
</script></body></html>
