<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  #bot { left: 250px; top: 300px; width: 580px; height: 638px; }
  #free { top: 1000px; background: #F6B52F; color: #041512; font-family: "Archivo Expanded Black"; font-size: 54px; padding: 22px 46px; }
  #dm { position: absolute; left: 140px; right: 140px; top: 1140px; height: 150px; border-radius: 75px; background: #F2F1EF;
        display: flex; align-items: center; padding: 0 30px 0 50px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  #dm .t { flex: 1; font-family: "Archivo Expanded Black"; font-size: 64px; color: #041512; letter-spacing: 2px; }
  #dm .t i { display: inline-block; width: 5px; height: 64px; background: #22674D; vertical-align: middle; margin-left: 6px; font-style: normal; }
  #dm .s { width: 100px; height: 100px; border-radius: 50%; background: #22674D; display: grid; place-items: center; }
  #dmlbl { position: absolute; left: 0; right: 0; top: 1080px; text-align: center; font-size: 34px; color: #5BE3C8; letter-spacing: 3px; }
  #logo { position: absolute; left: 50%; top: 1660px; width: 330px; margin-left: -165px; }
</style></head><body>
<div class="glow" style="top:640px"></div><div class="grid"></div>
<div class="bot" id="bot"></div>
<div class="pill" id="free">BEPUL HISOB-KITOB</div>
<div id="dmlbl">DIREKTGA YOZING</div>
<div id="dm"><div class="t"><span id="typed"></span><i id="cur"></i></div>
  <div class="s"><svg width="52" height="52" viewBox="0 0 24 24"><path d="M3 11 L21 3 L13 21 L11 13 Z" fill="#F2F1EF"/></svg></div></div>
<img id="logo" src="../../.claude/skills/montaj-uslubi/assets/logo_premium_solar_shaffof.png">
<script src="../../mashq/node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../mashq/scenes/common.js"></script>
<script src="../../mashq/scenes/panelbek.js"></script>
<script src="lib.js"></script>
<script>
  const B = document.getElementById('bot'); makeBot(B, ['salom', 'kozqisish']);
  const T = document.getElementById('typed'), W = 'HISOB';
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(B, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(1.8)' }, 0)
    .to(B, { rotation: 3, duration: 0.45, ease: 'sine.inOut', yoyo: true, repeat: 9, transformOrigin: '50% 95%' }, 0.4)
    .fromTo('#free', { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2.5)' }, 1.5)
    .to('#free', { y: -120, duration: 0.35, ease: 'power3.inOut' }, 2.55)
    .fromTo('#dm', { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power3.out' }, 2.6)
    .fromTo('#dmlbl', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.6)
    .fromTo('#cur', { opacity: 1 }, { opacity: 0, duration: 0.25, repeat: 9, yoyo: true, ease: 'steps(1)' }, 2.6)
    .fromTo('#logo', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 3.8);
  [...W].forEach((c, k) => tl.call(() => { T.textContent = W.slice(0, k + 1); }, null, 3.2 + k * 0.08));
  tl.call(() => { T.textContent = ''; }, null, 3.19);
  tl.fromTo('#dm .s', { scale: 1 }, { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1 }, 3.75);
  face(tl, B, 'kozqisish', 3.3);
  tl.set({}, {}, 5.2);
  window.tl = tl;
</script></body></html>
