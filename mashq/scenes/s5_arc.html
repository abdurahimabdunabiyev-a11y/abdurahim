<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  svg.arc { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
  .w1 { font-family: "Inter Display Black"; font-size: 64px; fill: #F2F1EF; letter-spacing: 1px; }
  .w2 { font-family: "Inter Display Black"; font-size: 70px; fill: #F6B52F; letter-spacing: 3px; }
  text { filter: drop-shadow(0 4px 10px rgba(0,0,0,.55)); }
</style></head><body>
<img class="full" data-seq="spk" data-max="150">
<svg class="arc" viewBox="0 0 1080 1920">
  <!-- bosh markazi ~ (552, 690); tepada yoy va iyak ostida yoy -->
  <path id="top" d="M 210 720 A 340 340 0 0 1 890 720" fill="none"/>
  <path id="bot" d="M 330 900 A 230 230 0 0 0 790 900" fill="none"/>
  <text class="w1" text-anchor="middle"><textPath href="#top" startOffset="50%">
    <tspan id="t1">Premium</tspan> <tspan id="t2">Solar</tspan> <tspan id="t3">bilan</tspan></textPath></text>
  <text class="w2" text-anchor="middle"><textPath href="#bot" startOffset="50%"><tspan id="t4">KAFOLAT</tspan></textPath></text>
</svg>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  addLabel('MASHQ 5 · YOY MATN');
  const tl = gsap.timeline({ paused: true });
  gsap.set(['#t1','#t2','#t3','#t4'], { opacity: 0 });
  tl.to('#t1', { opacity: 1, duration: 0.12 }, 0.4)
    .to('#t2', { opacity: 1, duration: 0.12 }, 0.75)
    .to('#t3', { opacity: 1, duration: 0.12 }, 1.05)
    .to('#t4', { opacity: 1, duration: 0.15 }, 1.5)
    .fromTo('#top', {}, {}, 0)
    .set({}, {}, 3.2);
  window.tl = tl;
</script></body></html>
