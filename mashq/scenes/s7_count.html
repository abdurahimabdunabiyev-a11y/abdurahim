<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { background: radial-gradient(120% 70% at 50% 0%, #C9741A 0%, #3a1d06 45%, #0a0705 80%); }
  #ghost { position: absolute; left: -40px; right: -40px; bottom: 120px; text-align: center; font-family: "Inter Display Black";
           font-size: 560px; letter-spacing: -30px; line-height: 1;
           background: linear-gradient(180deg, rgba(255,214,170,.55), rgba(255,214,170,0)); -webkit-background-clip: text; color: transparent; }
  #num { position: absolute; left: 0; right: 0; top: 720px; display: flex; justify-content: center; align-items: flex-end;
         font-family: "Inter Display Black"; font-size: 230px; color: #fff; letter-spacing: -6px; }
  .col { height: 230px; overflow: hidden; line-height: 230px; }
  .col div { display: block; }
  .sep, .unit { line-height: 230px; }
  .unit { font-size: 70px; letter-spacing: 0; margin-left: 10px; line-height: 1; padding-bottom: 30px; }
  #bar { position: absolute; left: 50%; top: 975px; transform: translateX(-50%); padding: 10px 70px; font-family: "Inter Display SemiBold";
         font-size: 60px; color: #fff; background: linear-gradient(90deg, rgba(246,181,47,0), #F6B52F 20%, #F6B52F 80%, rgba(246,181,47,0)); }
  .spark { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 18px 6px rgba(255,255,255,.7); }
</style></head><body>
<div id="ghost">30</div>
<div id="num"></div>
<div id="bar">yil bepul elektr</div>
<div class="spark" style="left:160px;top:420px"></div><div class="spark" style="left:900px;top:600px"></div>
<div class="spark" style="left:820px;top:1250px"></div><div class="spark" style="left:120px;top:1400px"></div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  addLabel('MASHQ 7 · RAQAM SANAGICH');
  // "30" -> har bir raqam ustuni g'ildirakdek aylanadi; maqsad 30 (yil)
  const target = '30', num = document.getElementById('num');
  [...target].forEach((d, i) => {
    const col = document.createElement('div'); col.className = 'col'; const inner = document.createElement('div');
    inner.id = 'c' + i; for (let k = 0; k <= 20 + +d; k++) { const x = document.createElement('div'); x.textContent = k % 10; inner.appendChild(x); }
    col.appendChild(inner); num.appendChild(col);
  });
  const tl = gsap.timeline({ paused: true });
  [...target].forEach((d, i) => tl.fromTo('#c' + i, { y: 0 }, { y: -(20 + +d) * 230, duration: 1.4 + i * 0.35, ease: 'expo.out' }, 0.3));
  tl.from('#bar', { scaleX: 0, opacity: 0, duration: 0.4, ease: 'power3.out' }, 1.6)
    .from('#ghost', { y: 120, opacity: 0, duration: 1.2, ease: 'power2.out' }, 0.2);
  document.querySelectorAll('.spark').forEach((s, k) => tl.fromTo(s, { y: 0, opacity: .2 }, { y: -160, opacity: 1, duration: 3.5, ease: 'none' }, 0));
  tl.set({}, {}, 3.5);
  window.tl = tl;
</script></body></html>
