<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { background: #E9E8E4; }
  #bg { position: absolute; inset: 0; }
  #big { position: absolute; left: 0; right: 0; top: 860px; text-align: center; font-family: "Inter Display Black";
         font-size: 210px; color: #041512; letter-spacing: -8px; line-height: .9; }
  #big small { display: block; font-family: "Inter Display SemiBold"; font-size: 54px; letter-spacing: 0; color: #22674D; margin-bottom: 18px; }
  #card { position: absolute; width: 1080px; height: 1920px; left: 0; top: 0; overflow: hidden; transform-origin: 0 50%; }
</style></head><body>
<div id="big"><small>har oy elektr uchun</small>pul to'lab</div>
<div id="card"><img class="full" data-seq="spk" data-max="150"></div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  addLabel('MASHQ 3 · KARTA PUSH');
  const tl = gsap.timeline({ paused: true });
  // boshlanish: kichik karta chap chetdan tashqarida
  tl.set('#card', { x: -420, y: 760, scale: 0.3, borderRadius: 90 }, 0)
    .from('#big', { y: 40, opacity: 0, duration: 0.3, ease: 'power2.out' }, 0.1)
    .to('#card', { x: 60, duration: 0.45, ease: 'power3.out' }, 0.9)             // karta kiradi
    .to('#big', { x: 260, opacity: 0.25, duration: 0.45, ease: 'power3.out' }, 0.9)
    .to('#card', { x: 0, y: 0, scale: 1, borderRadius: 0, duration: 0.6, ease: 'power3.inOut' }, 1.5) // to'liq ekranga
    .set({}, {}, 3.0);
  window.tl = tl;
</script></body></html>
