<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'GS';src:url('file:///root/.fonts/montaj/GeneralSansBold.ttf');font-weight:700}
@font-face{font-family:'GS';src:url('file:///root/.fonts/montaj/GeneralSansMedium.ttf');font-weight:500}
@font-face{font-family:'GS';src:url('file:///root/.fonts/montaj/GeneralSansBoldItalic.ttf');font-weight:700;font-style:italic}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
.ab{position:absolute}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.cap{position:absolute;left:0;width:1080px;text-align:center;font-family:'GS';font-weight:500;font-size:48px;color:#fff;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.45);opacity:0}
.cap span{display:inline-block;margin:0 .13em}
.cap b{font-weight:700;font-style:italic}
.glass{position:absolute;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);border:2px solid rgba(255,255,255,.55);box-shadow:0 18px 50px rgba(0,0,0,.25);opacity:0}
.chip{position:absolute;background:#fff;color:#111;font-family:'GS';font-weight:700;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
/* oq "doska" */
#board{position:absolute;inset:0;background:#E4E4E4;opacity:0}
.tile{position:absolute;width:400px;height:300px;background:#F4F4F4;border-radius:40px;box-shadow:0 24px 50px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);opacity:0;overflow:hidden}
.tile .n{position:absolute;left:36px;bottom:34px;font-family:'GS';font-weight:700;font-size:64px;color:#1b1b1b}
.tile .t{position:absolute;right:26px;top:26px;font-family:'GS';font-weight:500;font-size:26px;color:#fff;background:#B9B9B9;border-radius:999px;padding:6px 16px}
#typed{position:absolute;left:0;width:1080px;top:520px;text-align:center;font-family:'GS';font-weight:500;font-size:58px;color:#2a2a2a}
#cur{display:inline-block;width:4px;height:58px;background:#2a2a2a;vertical-align:-8px;margin-left:4px}
</style></head><body>
<img id="bg">
<!-- doska -->
<div id="board">
  <div id="typed"><span id="tx"></span><span id="cur"></span></div>
  <div class="tile" id="t0" style="left:120px;top:700px"><div class="t">panel</div><div class="n">LONGi</div></div>
  <div class="tile" id="t1" style="left:560px;top:700px"><div class="t">panel</div><div class="n">Jinko</div></div>
  <div class="tile" id="t2" style="left:120px;top:1040px"><div class="t">panel</div><div class="n">ERA</div></div>
  <div class="tile" id="t3" style="left:560px;top:1040px"><img src="ronma_card.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.8)"><div class="t">panel</div><div class="n" style="color:#fff">Ronma</div></div>
  <div id="bpan" class="ab" style="left:0;width:1080px;top:1410px;text-align:center;font-family:'GS';font-weight:500;font-size:52px;color:#2a2a2a;opacity:0">panellari</div>
</div>
<!-- shisha karta: Deye -->
<div class="glass" id="g1" style="left:360px;top:760px;width:360px;height:400px;border-radius:44px">
  <div class="ab" style="left:0;width:360px;top:120px;text-align:center;font-family:'GS';font-weight:700;font-size:96px;color:#fff">Deye</div>
  <div class="ab" style="left:0;width:360px;top:250px;text-align:center;font-family:'GS';font-weight:500;font-size:42px;color:#fff">invertor</div>
</div>
<div class="chip" id="ch1" style="left:430px;top:730px;font-size:40px;padding:8px 26px;opacity:0">hamda</div>
<!-- 10 / 500 doiralari -->
<div class="glass" id="o1" style="left:300px;top:1110px;width:200px;height:200px;border-radius:50%"><div class="ab" style="inset:0;display:flex;align-items:center;justify-content:center;font-family:'GS';font-weight:700;font-size:78px;color:#fff">10</div></div>
<div class="glass" id="o2" style="left:580px;top:1110px;width:200px;height:200px;border-radius:50%"><div class="ab" style="inset:0;display:flex;align-items:center;justify-content:center;font-family:'GS';font-weight:700;font-size:70px;color:#fff">500</div></div>
<div id="caps"></div>
<script src="../mashq/node_modules/gsap/dist/gsap.min.js"></script>
<script>
const tl = gsap.timeline({paused: true}); window.tl = tl; const FPS = 30, TOTAL = 9.1333;
function rv(el, t) { gsap.set(el, {opacity: 0, filter: 'blur(10px)', y: 8}); tl.to(el, {opacity: 1, filter: 'blur(0px)', y: 0, duration: .22, ease: 'power2.out'}, t); }
function cap(top, t0, t1, words, big) {
  const c = document.createElement('div'); c.className = 'cap'; c.style.top = top + 'px'; document.getElementById('caps').appendChild(c);
  words.forEach(([w, t, b]) => { const s = document.createElement('span'); s.innerHTML = b ? `<b>${w}</b>` : w; c.appendChild(s); rv(s, t); });
  if (big) { const d = document.createElement('div'); d.textContent = big[0]; d.style.cssText = "font-weight:700;font-size:118px;letter-spacing:1px;margin-top:2px"; c.appendChild(d); rv(d, big[1]); }
  tl.set(c, {opacity: 1}, t0); tl.to(c, {opacity: 0, filter: 'blur(6px)', duration: .16}, t1 - .16);
}
function pop(el, t) { gsap.set(el, {opacity: 0, scale: .86, filter: 'blur(8px)'}); tl.to(el, {opacity: 1, scale: 1, filter: 'blur(0px)', duration: .3, ease: 'back.out(1.6)'}, t); }
// so'z vaqtlari: Birinchisi 0, hammasi 1.06, omborda 1.53, bor 2.02, LONGi 2.39, Jinko 3.08, ERA 3.68, Ronma 4.00, panellari 4.30,
// hamda 4.84, Deye 5.28, invertorlari 5.65, 10 6.46, ta 6.65, kerakmi 6.80, ya 7.39, 500 7.59, tami 7.73, Hammasi 8.27, bor 8.64
cap(990, 0.0, 1.06, [['Birinchisi,', 0.02]]);
cap(990, 1.06, 2.36, [['hammasi', 1.06], ['omborda', 1.53, 1], ['bor:', 2.02]]);
// doska
tl.to('#board', {opacity: 1, duration: .14}, 2.36); tl.to('#board', {opacity: 0, duration: .14}, 4.80);
const TXT = 'omborda bor:'; tl.call(() => {}, null, 0);
for (let i = 0; i <= TXT.length; i++) tl.set('#tx', {textContent: TXT.slice(0, i)}, 2.40 + i * .035);
tl.to('#cur', {opacity: 0, duration: .01, repeat: 9, yoyo: true, repeatDelay: .25}, 2.9);
[['#t0', 2.39], ['#t1', 3.08], ['#t2', 3.68], ['#t3', 4.00]].forEach(([id, t]) => pop(id, t));
rv(document.getElementById('bpan'), 4.30);
// Deye shisha karta
cap(990, 4.84, 5.26, [['hamda', 4.84]]);
pop('#g1', 5.26); tl.to('#g1', {opacity: 0, scale: .95, duration: .2}, 6.26);
// 10 / 500
cap(980, 6.46, 8.25, [['10', 6.46], ['ta', 6.65], ['kerakmi,', 6.80], ['ya', 7.39], ['500', 7.59, 1], ['tami?', 7.73, 1]]);
pop('#o1', 6.50); pop('#o2', 7.59); tl.to(['#o1', '#o2'], {opacity: 0, duration: .16}, 8.09);
// yakun
cap(930, 8.27, TOTAL + .3, [['Hammasi', 8.27]], ['BOR!', 8.62]);
tl.set({}, {}, TOTAL);
const bg = document.getElementById('bg');
window.renderFrame = async i => { const src = `kadr/b_${String(Math.min(274, i + 1)).padStart(4, '0')}.jpg`; if (bg.getAttribute('src') !== src) { bg.setAttribute('src', src); await bg.decode().catch(() => {}); } tl.seek(i / FPS, false); };
</script></body></html>
