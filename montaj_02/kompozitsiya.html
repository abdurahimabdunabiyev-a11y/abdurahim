<script>
const $ = s => document.querySelector(s);
// yirtiq chet generatori
let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
function tornEdge(x0, y0, x1, y1, amp, step) { const pts = []; const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step);
  for (let i = 0; i <= n; i++) { const t = i / n, nx = -(y1 - y0), ny = x1 - x0, L = Math.hypot(nx, ny), a = (rnd() - .5) * 2 * amp;
    pts.push([x0 + (x1 - x0) * t + nx / L * a, y0 + (y1 - y0) * t + ny / L * a]); } return pts; }
const poly = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ' Z';
// wipe: chap-o'ng yirtiq chetli qog'oz
$('#wipep').setAttribute('d', poly([...tornEdge(80, 0, 80, 2200, 26, 40), ...tornEdge(1420, 2200, 1420, 0, 26, 40)]));
// S3/S7 fon yirtig'i
$('#s3t').innerHTML = `<path d="${poly([[0,0],[1080,0],...tornEdge(1080,520,0,700,22,36)])}" fill="#F1EADB"/>`;
$('#s7t').innerHTML = `<path d="${poly([[0,1920],[1080,1920],...tornEdge(1080,1300,0,1420,22,36)])}" fill="#174e3b"/>`;
// hisob qog'ozi (pastki tishli)
let bp = 'M0 0 H780 V1000'; for (let x = 780; x > 0; x -= 39) bp += ` L${x - 19.5} 1060 L${x - 39} 1000`; $('#billp').setAttribute('d', bp + ' Z');
// lampalar
const L = $('#lamps');
[200, 540, 880].forEach((x, k) => L.insertAdjacentHTML('beforeend', `
  <div style="position:absolute;left:${x - 4}px;top:284px;width:8px;height:220px;background:#1d1a16"></div>
  <div class="cone" style="position:absolute;left:${x - 260}px;top:560px;width:520px;height:800px;background:linear-gradient(rgba(255,226,140,.65),rgba(255,226,140,0));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)"></div>
  <div style="position:absolute;left:${x - 90}px;top:500px;width:180px;height:70px;background:#2F6F8F;border:8px solid #1d1a16;border-radius:90px 90px 10px 10px"></div>
  <div class="bulb" style="position:absolute;left:${x - 36}px;top:560px;width:72px;height:50px;border-radius:0 0 40px 40px;background:#FFE38A;box-shadow:0 0 60px 20px rgba(255,220,120,.8)"></div>`));

const wk = (x, c) => `<g transform="translate(${x} 0)"><rect x="-55" y="170" width="110" height="200" rx="40" fill="${c}" stroke="#1d1a16" stroke-width="7"/>
  <circle cx="0" cy="120" r="52" fill="#D9A47A" stroke="#1d1a16" stroke-width="7"/><path d="M-60 100 Q0 30 60 100 Z" fill="#F6B52F" stroke="#1d1a16" stroke-width="7"/>

$('#workers').innerHTML = wk(100, '#2F6F8F') + wk(230, '#22674D') + wk(340, '#3E5C76');

let pg = ''; for (let i = 0; i < 6; i++) pg += `<g class="pn" transform="translate(${230 + i * 110} 205)"><path d="M0 100 L30 0 L130 0 L100 100 Z" fill="#1F3F73" stroke="#1d1a16" stroke-width="6"/><path d="M15 50 H115 M48 0 L35 100 M82 0 L68 100" stroke="#5B8BD0" stroke-width="3"/></g>`;
$('#panels').innerHTML = pg;
// akkumulyator kataklari
let cg = ''; for (let i = 0; i < 5; i++) cg += `<rect class="cell" x="80" y="${700 - i * 135}" width="340" height="110" rx="18" fill="#5BE3C8" stroke="#1d1a16" stroke-width="6"/>`;
$('#cells').innerHTML = cg;

const pbm = (el, faces, wave = true) => faces.forEach((f, k) => el.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 400 440" data-f="${f}" style="position:absolute;inset:0;opacity:${k ? 0 : 1}">${bot(f, wave)}</svg>`));
const face = (tl, el, f, t) => el.querySelectorAll('svg').forEach(s => tl.set(s, { opacity: s.dataset.f === f ? 1 : 0 }, t));
pbm($('#pb3'), ['salom', 'kozqisish']); pbm($('#pb4'), ['salom', 'hayron'], false); pbm($('#pb9'), ['salom', 'kozqisish']);

// ================= TIMELINE (global vaqt, ovozga mos) =================
const tl = gsap.timeline({ paused: true });
const SC = [['#s1', 0, 3.8], ['#s2', 3.8, 7.3], ['#s3', 7.3, 11.35], ['#s4', 11.35, 15.0], ['#s5', 15.0, 22.3], ['#s7', 22.3, 25.35], ['#s1', 25.35, 27.7], ['#s9', 27.7, 33.2]];
SC.forEach(([id, a, b]) => { tl.set(id, { opacity: 1 }, a); tl.set(id, { opacity: 0 }, b); });
SC.slice(1).forEach(([, a], k) => { const col = ['#1d1a16', '#22674D', '#F6B52F', '#C8372D', '#1d1a16', '#3E5C76', '#F6B52F'][k % 7];
  tl.set('#wipep', { attr: { fill: col } }, a - 0.22).fromTo('#wipe', { x: 0 }, { x: -2700, duration: 0.44, ease: 'power2.inOut' }, a - 0.22); });
const pop = (sel, t, from = 0.3) => tl.fromTo(sel, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: 'back.out(2.2)' }, t);
const keepX = { xPercent: -50 };

// S1 hook: sex ishlayapti -> svet ketdi
tl.fromTo('#s1', { scale: 1.06 }, { scale: 1, duration: 3.8, ease: 'none', transformOrigin: '50% 60%' }, 0);
tl.to('.cone', { opacity: 0, duration: 0.06, repeat: 3, yoyo: true }, 1.0).set('.cone', { opacity: 0 }, 1.3)

  .to('.scr', { attr: { fill: '#22303a' }, duration: 0.05 }, 1.3)
  .to('#dark', { opacity: 0.72, duration: 0.12 }, 1.3)
  .fromTo('#s1stamp', { scale: 2.2, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.22, ease: 'power4.in' }, 1.35)
  .fromTo('#s1h', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power3.out' }, 2.45);
// S2
pop('#c1', 3.9); pop('#l1', 4.21); pop('#c2', 4.9); pop('#l2', 5.04); pop('#c3', 5.95); tl.fromTo('#l3', { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: 'power4.in' }, 6.5);
// S3
tl.fromTo('#pb3', { y: 1300 }, { y: 0, duration: 0.42, ease: 'power3.out' }, 7.35)
  .to('#pb3', { rotation: 3, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 6, transformOrigin: '50% 95%' }, 7.9);
pop('#s3name', 8.2); pop('#s3role', 8.95); pop('#s3k', 10.1); face(tl, $('#pb3'), 'kozqisish', 10.5); face(tl, $('#pb3'), 'salom', 10.95);
// S4
const o = { v: 0 }, fmt = v => Math.round(v).toLocaleString('en-US').replace(/,/g, ' ');
