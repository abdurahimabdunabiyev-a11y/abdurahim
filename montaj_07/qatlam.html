<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'AN';src:url('../montaj_05/anton.ttf')}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
.ab{position:absolute}
body.back .front{display:none} body.front .back{display:none}
/* sarlavhalar: Helvetica Neue Bold o'rniga Inter Bold, oq, soyasiz */
.grp{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
.pre,.post{position:absolute;font-family:'Inter',sans-serif;font-weight:700;color:#fff;white-space:nowrap}
.pre{font-size:54px}.post{font-size:50px}
.hero{position:absolute;font-family:'Inter',sans-serif;font-weight:800;color:#fff;font-size:150px;letter-spacing:-.035em;white-space:nowrap;line-height:1;transform-origin:50% 60%}
.big{font-family:'AN',sans-serif;color:#fff;white-space:nowrap;line-height:1;transform-origin:50% 50%}
.cap{position:absolute;height:96px;padding:0 40px;border-radius:48px;background:#fff;color:#0B0B0B;font-family:'Inter',sans-serif;font-weight:800;font-size:46px;display:flex;align-items:center;justify-content:center;white-space:nowrap;opacity:0}
#shade{position:absolute;left:0;top:900px;width:1080px;height:1020px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.55) 100%)}
</style></head><body>
<!-- ORQA: odam orqasidagi katta yozuv -->
<div class="back">
  <div id="bw" class="ab big" style="left:0;top:370px;width:1024px;text-align:center;font-size:235px;opacity:0;transform:scaleY(1.3)">OMBORDA</div>
</div>
<!-- OLD -->
<div class="front">
  <div id="shade"></div>
  <div id="bw_pre" class="ab pre" style="left:110px;top:262px;opacity:0">hammasi</div>
  <div id="bw_post" class="ab post" style="left:820px;top:735px;opacity:0">bor</div>
  <svg id="ln" class="ab" style="left:0;top:0;opacity:0" width="1080" height="1920"><path id="lp" d="M250 380 L774 380 L774 560 L250 560 Z" fill="none" stroke="#fff" stroke-width="4" stroke-opacity=".55"/></svg>
  <div id="c0" class="cap">LONGi</div><div id="c1" class="cap">Jinko</div><div id="c2" class="cap">ERA</div><div id="c3" class="cap">Ronma</div>
  <div id="c4" class="cap" style="font-size:54px;height:110px;border-radius:55px;padding:0 54px">Deye</div>
  <div id="gs"></div>
</div>
<script src="../mashq/node_modules/gsap/dist/gsap.min.js"></script>
<script>
document.body.className = (location.search.match(/layer=(\w+)/) || [, 'front'])[1];
const tl = gsap.timeline({paused: true}); window.tl = tl; const FPS = 30, TOTAL = 9.1333;
const CX = 512;   // safe zona markazi
// --- sarlavha guruhlari: [boshlanish, pre, hero, post, pre_vaqt, hero_vaqt, post_vaqt]
const G = [
  [0.00, '1-sabab', 'Birinchisi', '', 0.00, 0.05, null],
  [4.30, '', 'panellari', '', null, 4.30, null],
  [4.84, 'hamda', 'invertorlari', '', 4.84, 5.65, null],
  [6.46, '10 ta kerakmi, ya', '500 tami?', '', 6.46, 7.59, null],
  [8.27, '', 'Hammasi bor!', '', null, 8.27, null],
];
const ENDS = {0: 1.06, 1: 4.84, 2: 6.40, 3: 8.27, 4: TOTAL};
const gs = document.getElementById('gs');
G.forEach((g, k) => {
  const d = document.createElement('div'); d.className = 'grp'; gs.appendChild(d);
  const hero = document.createElement('div'); hero.className = 'hero'; hero.textContent = g[2]; d.appendChild(hero);
  const hw = Math.min(860, hero.getBoundingClientRect().width); const sc = Math.min(1, 860 / hero.getBoundingClientRect().width);
  hero.style.fontSize = (150 * sc) + 'px'; const W2 = hero.getBoundingClientRect().width;
  hero.style.left = (CX - W2 / 2) + 'px'; hero.style.top = (1090 - 75 * sc) + 'px';
  tl.set(d, {opacity: 1}, g[0]);
  gsap.set(hero, {opacity: 0, y: 34, scale: .8});
  tl.to(hero, {opacity: 1, duration: .1}, g[5]); tl.to(hero, {y: 0, duration: .16, ease: 'power2.out'}, g[5]);
  tl.to(hero, {keyframes: [{scale: 1.06, duration: .14, ease: 'power2.out'}, {scale: 1, duration: .14, ease: 'power2.inOut'}]}, g[5]);
  if (g[1]) {
    const p = document.createElement('div'); p.className = 'pre'; p.textContent = g[1]; d.appendChild(p);
    p.style.left = (CX - W2 / 2 + 6) + 'px'; p.style.top = (1090 - 75 * sc - 74) + 'px';
    gsap.set(p, {opacity: 0, y: 34}); tl.to(p, {opacity: 1, duration: .1}, g[4]); tl.to(p, {y: 0, duration: .16, ease: 'power2.out'}, g[4]);
  }
  tl.to(d, {opacity: 0, duration: .2}, ENDS[k] - .2);
});
// --- odam orqasidagi "OMBORDA" (1.06–2.39)
gsap.set('#bw', {opacity: 0, y: 40}); tl.to('#bw', {opacity: 1, y: 0, duration: .25, ease: 'power2.out'}, 1.50);
tl.to('#bw', {opacity: 0, duration: .2}, 2.25);
gsap.set(['#bw_pre', '#bw_post'], {opacity: 0, y: 34});
tl.to('#bw_pre', {opacity: 1, y: 0, duration: .16}, 1.06); tl.to('#bw_post', {opacity: 1, y: 0, duration: .16}, 2.02);
tl.to(['#bw_pre', '#bw_post'], {opacity: 0, duration: .2}, 2.25);
// --- brend kapsulalari (minimal oq grafika, ramka chizig'i bilan bog'langan)
const pos = [[250, 380], [774, 380], [250, 560], [774, 560]];
['#c0', '#c1', '#c2', '#c3'].forEach((id, i) => {
  const e = document.querySelector(id); const r = e.getBoundingClientRect();
  e.style.left = (pos[i][0] - r.width / 2) + 'px'; e.style.top = (pos[i][1] - 48) + 'px';
  gsap.set(e, {scale: .6, opacity: 0});
  tl.to(e, {opacity: 1, duration: .08}, [2.39, 3.08, 3.68, 4.00][i]);
  tl.to(e, {keyframes: [{scale: 1.08, duration: .15, ease: 'power2.out'}, {scale: 1, duration: .1}]}, [2.39, 3.08, 3.68, 4.00][i]);
  tl.to(e, {opacity: 0, scale: .9, duration: .2}, 4.80);
});
tl.fromTo('#ln', {opacity: 0}, {opacity: 1, duration: .3}, 2.5); tl.to('#ln', {opacity: 0, duration: .2}, 4.8);
const c4 = document.querySelector('#c4'); { const r = c4.getBoundingClientRect(); c4.style.left = (CX - r.width / 2) + 'px'; c4.style.top = '420px'; }
gsap.set(c4, {scale: .6, opacity: 0}); tl.to(c4, {opacity: 1, duration: .08}, 5.28);
tl.to(c4, {keyframes: [{scale: 1.08, duration: .15, ease: 'power2.out'}, {scale: 1, duration: .1}]}, 5.28); tl.to(c4, {opacity: 0, duration: .2}, 6.40);
tl.set({}, {}, TOTAL);
window.renderFrame = async i => { tl.seek(i / FPS, false); };
</script></body></html>
