<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
:root{--g:#1E8A5A;--gd:#22674D;--w:#fff}
.ab{position:absolute}
.big{font-family:'Montserrat Black',sans-serif;font-weight:900;font-style:italic;color:#fff;letter-spacing:-3px;line-height:.9;white-space:nowrap;
     text-shadow:0 0 2px rgba(0,0,0,.25),6px 8px 0 #1E8A5A,0 18px 40px rgba(0,0,0,.45)}
.kick{font-family:'Inter',sans-serif;font-weight:400;font-style:italic;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.7);font-size:50px;white-space:nowrap}
.tag{font-family:'Inter',sans-serif;font-weight:600;font-style:italic;font-size:42px;color:#fff;background:var(--g);border-radius:999px;padding:8px 22px;white-space:nowrap}
.big span,.kick span{display:inline-block;opacity:0}
.px{position:absolute;width:22px;height:22px;background:var(--g);opacity:0}
body.back .front{display:none} body.front .back{display:none}
</style></head><body>
<!-- ORQA qatlam (odam orqasida) -->
<div class="back">
  <div id="w1" class="ab big" style="left:0;width:1080px;text-align:center;top:420px;font-size:250px"></div>
  <div id="card" class="ab" style="left:330px;top:150px;width:420px;height:520px;border:7px solid var(--g);border-radius:46px;opacity:0;box-shadow:0 0 0 2px rgba(255,255,255,.6)"></div>
  <svg id="rings" class="ab" style="left:240px;top:110px;opacity:0" width="600" height="600" viewBox="0 0 600 600">
    <circle id="r1" cx="300" cy="300" r="120" fill="none" stroke="#1E8A5A" stroke-width="4"/>
    <circle id="r2" cx="300" cy="300" r="120" fill="none" stroke="#1E8A5A" stroke-width="3" stroke-dasharray="4 10"/>
  </svg>
</div>
<!-- OLD qatlam -->
<div class="front">
  <div id="k1" class="ab kick" style="left:0;width:1080px;text-align:center;top:350px"></div>
  <div id="t1" class="ab tag" style="left:700px;top:660px;opacity:0">bor ✓</div>
  <div id="w2" class="ab big" style="left:0;width:1080px;text-align:center;top:690px;font-size:150px"></div>
  <div id="k2" class="ab kick" style="left:0;width:1080px;text-align:center;top:640px;opacity:0">paneli</div>
  <div id="t2" class="ab tag" style="left:420px;top:850px;opacity:0">invertor</div>
  <div id="pxs"></div>
  <svg id="streak" class="ab" style="left:0;top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path id="sp" d="M560 2000 C 420 1700, 700 1500, 540 1250 S 380 900, 560 650 S 720 300, 520 -80" fill="none" stroke="#9BFFCB" stroke-width="10" stroke-linecap="round" filter="url(#gl)"/>
  </svg>
</div>
<script src="../../mashq/node_modules/gsap/dist/gsap.min.js"></script>
<script>
document.body.className = (location.search.match(/layer=(\w+)/) || [, 'front'])[1];
const tl = gsap.timeline({paused: true}); window.tl = tl;
function type(el, txt, t, per = .06) {
  const e = document.querySelector(el);
  tl.call(() => { e.innerHTML = [...txt].map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join(''); }, null, t - .001);
  // seek-safe: harflarni oldindan joylab, opacity bilan boshqaramiz
}
// seek-safe yozish: har bir matn uchun alohida div ichida spanlar
function word(el, txt, t, per = .065, out = null) {
  const box = document.querySelector(el);
  const d = document.createElement('div'); d.innerHTML = [...txt].map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('');
  d.style.position = 'absolute'; d.style.left = 0; d.style.right = 0; box.appendChild(d);
  d.style.display='inline-block'; d.style.whiteSpace='nowrap'; d.style.position='absolute'; d.style.left='50%'; d.style.right='auto';
  const fs = parseFloat(getComputedStyle(box).fontSize); const wd = d.getBoundingClientRect().width;
  const k = Math.min(1, 960 / wd); d.style.fontSize = (fs * k) + 'px'; d.style.right = 'auto'; d.style.transform = 'translateX(-50%)';
  const sp = d.querySelectorAll('span');
  gsap.set(sp, {opacity: 0, y: 30, skewX: -8});
  tl.to(sp, {opacity: 1, y: 0, skewX: 0, duration: .16, ease: 'back.out(2.4)', stagger: per}, t);
  if (out !== null) tl.to(sp, {opacity: 0, y: -20, duration: .12, stagger: .02, ease: 'power2.in'}, out);
  return sp.length * per;
}
function burst(x, y, t, n = 6) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'px front'; document.getElementById('pxs').appendChild(p);
    const s = 12 + (i * 7) % 16; gsap.set(p, {left: x, top: y, width: s, height: s, opacity: 0});
    const dx = Math.cos(i * 1.9) * (60 + i * 18), dy = Math.sin(i * 2.3) * (40 + i * 14);
    tl.to(p, {opacity: 1, x: dx * .6, y: dy * .6, duration: .12, ease: 'power2.out'}, t + i * .03);
    tl.to(p, {opacity: 0, x: dx, y: dy, duration: .35, ease: 'power1.in'}, t + .25 + i * .03);
  }
}
// A sahna: 1-SABAB -> OMBORDA
word('#k1', 'Birinchisi —', .25, .03, 1.0);
word('#w1', '1-SABAB', .35, .07, 1.0); burst(760, 420, .5); burst(250, 600, .6, 4);
word('#k1', 'hammasi', 1.1, .03, 2.2);
word('#w1', 'OMBORDA', 1.5, .07, 2.2); burst(820, 470, 1.6); burst(200, 640, 1.75, 4);
gsap.set('#t1', {opacity: 0, scale: .5}); tl.to('#t1', {opacity: 1, scale: 1, duration: .25, ease: 'back.out(2)'}, 2.02); tl.to('#t1', {opacity: 0, duration: .15}, 2.25);
// nur chizig'i o'tishi
const sp = document.getElementById('sp'); const L = 2600;
gsap.set(sp, {strokeDasharray: `520 ${L}`, strokeDashoffset: 520, opacity: 0});
tl.to(sp, {opacity: 1, duration: .05}, 2.15); tl.to(sp, {strokeDashoffset: -L, duration: .5, ease: 'power2.inOut'}, 2.15); tl.to(sp, {opacity: 0, duration: .1}, 2.62);
// B sahna: PIP karta + brendlar
gsap.set('#card', {opacity: 0, scale: .85}); tl.to('#card', {opacity: 1, scale: 1, duration: .35, ease: 'back.out(1.6)'}, 2.4);
gsap.set('#rings', {opacity: 0}); tl.set('#rings', {opacity: 1}, 2.4);
tl.fromTo('#r1', {attr: {r: 120}, opacity: 1}, {attr: {r: 300}, opacity: 0, duration: .8, ease: 'power2.out'}, 2.4);
tl.fromTo('#r2', {attr: {r: 140}, opacity: 1}, {attr: {r: 290}, opacity: 0, duration: 1.0, ease: 'power2.out'}, 2.48);
const B = [['LONGi', 2.39, 3.0], ['Jinko', 3.08, 3.6], ['ERA', 3.68, 3.95], ['Ronma', 4.0, 5.2], ['Deye', 5.28, null]];
B.forEach(([n, t, o]) => { word('#w2', n, t, .05, o); burst(800, 720, t + .05, 4); });
tl.to('#k2', {opacity: 1, duration: .2}, 4.3); tl.to('#k2', {opacity: 0, duration: .15}, 5.15);
gsap.set('#t2', {opacity: 0, scale: .5}); tl.to('#t2', {opacity: 1, scale: 1, duration: .25, ease: 'back.out(2)'}, 5.65);
tl.set({}, {}, 6.5);
window.renderFrame = async i => { tl.seek(i / 30, false); };
</script></body></html>
